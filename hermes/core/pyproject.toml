[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-for-qqbot-soyo"
version = "1.0.0"
description = "Bot native DSH QQ agent contracts and workers"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1", "websockets>=12,<16", "PyYAML>=6,<7", "psutil>=6,<8",
    "Pillow>=10,<13", "beautifulsoup4>=4.12,<5", "tzdata>=2025.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
agent-qqbot = "soyo.app.__main__:main"

[project.optional-dependencies]
live2d = ["cryptography>=44,<50"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["soyo*"]

[tool.setuptools.package-data]
soyo = ["dsh/**/*.mjs", "dsh/**/*.js", "dsh/**/*.json", "dsh/**/LICENSE", "dsh/**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/soyo"]
